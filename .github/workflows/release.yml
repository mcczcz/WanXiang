on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (for example v0.1.0)
        type: string

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Check release tag matches tooth.json version
        shell: bash
        run: |
          version=$(jq -er '.version | strings | select(length > 0)' tooth.json)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match tooth.json version 'v$version'."
            exit 1
          fi

  build:
    needs: validate-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22
      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows --toolchain=clang-cl --target_type=server -y

      - run: |
          xmake -w -y

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-server-windows-x64
          path: |
            bin/

  update-release-notes:
    needs: validate-version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v2

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-server-windows-x64
          path: artifact

      - run: |
          cp CHANGELOG.md LICENSE README.md artifact/

      - run: |
          zip -r ../${{ github.event.repository.name }}-server-windows-x64.zip *
        working-directory: artifact

      - name: Calculate SHA256
        id: calculate-sha256
        run: |
          echo release=$(sha256sum ${{ github.event.repository.name }}-server-windows-x64.zip | awk '{print $1}') >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          append_body: true
          body: |
            | File | SHA256 |
            | ---- | ------ |
            | ${{ github.event.repository.name }}-server-windows-x64.zip | ${{ steps.calculate-sha256.outputs.release }} |
          files: |
            ${{ github.event.repository.name }}-server-windows-x64.zip
